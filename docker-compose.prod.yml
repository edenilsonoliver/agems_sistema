services:
  # Database Service
  db:
    image: postgres:16-alpine
    container_name: agems_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped
    networks:
      - agems_network

  # Redis Service (Caching & Task Queue)
  redis:
    image: redis:7-alpine
    container_name: agems_redis
    restart: unless-stopped
    networks:
      - agems_network

  # Django Application Service
  web:
    build: .
    container_name: agems_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --log-level info
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - agems_network

  # Celery Worker Service
  celery_worker:
    build: .
    container_name: agems_worker
    command: celery -A config worker --loglevel=info
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - agems_network

  # Celery Beat Service
  celery_beat:
    build: .
    container_name: agems_beat
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - agems_network

  # Nginx (Reverse Proxy & Static Files)
  nginx:
    image: nginx:1.25-alpine
    container_name: agems_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/agems.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - agems_network

networks:
  agems_network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
