services:
  # Aplicação Django com SQLite
  web:
    build: .
    container_name: agems_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    # environment:
    #   - DEBUG=True
    #   - SECRET_KEY=... (Used from .env)
    #   - ALLOWED_HOSTS=... (Used from .env)
    # Valores específicos para Docker que sobrescrevem o .env:
    environment:
      - DATABASE_URL=sqlite:////app/db.sqlite3 # Forçando SQLite no Docker por enquanto conforme original
      - USE_SQLITE=True
    networks:
      - agems_network
    restart: unless-stopped

networks:
  agems_network:
    driver: bridge
