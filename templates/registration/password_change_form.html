{% extends "base.html" %}

{% block content %}
<main id="main" class="main">
    <div class="pagetitle">
        <h1>Alterar Senha</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'dashboard' %}">Home</a></li>
                <li class="breadcrumb-item active">Alterar Senha</li>
            </ol>
        </nav>
    </div><!-- End Page Title -->

    <section class="section">
        <div class="row justify-content-center">
            <div class="col-lg-6 mt-4">

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Definir Nova Senha</h5>

                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <p class="text-muted">Por segurança, você está utilizando uma senha temporária. Defina
                                    sua nova senha definitiva abaixo antes de continuar.</p>
                            </div>

                            {{ form.as_p }}

                            <div class="text-end mt-4">
                                <button type="submit" class="btn btn-primary">Validar Senha Nova</button>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </section>
</main>
{% endblock %}
