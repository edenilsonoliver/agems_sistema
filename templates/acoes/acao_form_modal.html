{% load crispy_forms_tags %}

<form method="post" action="{% url 'acao_edit_ajax' acao.pk %}" id="acaoEditForm">
    {% csrf_token %}

    <div class="row">
        <div class="col-12">
            {{form|crispy}}
        </div>
    </div>

    <hr class="my-3">
    <h6 class="mb-3 fw-bold">
        <i class="bi bi-list-check me-2 text-primary"></i> Checklist de Tarefas Operativas
    </h6>

    {{checklist_formset.management_form}}

    <div id="checklist-items-modal">
        {% for form in checklist_formset %}
        <div class="checklist-item mb-2 d-flex align-items-center gap-2">
            {{form.id}}
            <input type="text" name="{{form.nome.html_name}}" id="{{form.nome.id_for_label}}"
                value="{{form.nome.value|default:''}}" class="form-control form-control-sm"
                placeholder="Item do checklist">

            <div class="form-check">
                <input type="checkbox" name="{{form.concluido.html_name}}" id="{{form.concluido.id_for_label}}"
                    class="form-check-input" {% if form.concluido.value %}checked{% endif %}>
            </div>

            {{form.DELETE}}
        </div>
        {% endfor %}
    </div>

    <div class="modal-footer px-0 pb-0 mt-4 border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary px-4">Salvar Alterações</button>
    </div>
</form>

<script>
    document.getElementById('acaoEditForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    window.location.reload();
                } else {
                    alert('Erro ao salvar: Verifique os campos do formulário.');
                }
            })
            .catch(err => {
                console.error(err);
                alert('Erro de comunicação com o servidor.');
            });
    });
</script>
